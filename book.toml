[book]
title = "Fluzo"
description = "Product specifications, architecture and delivery planning for Fluzo."
authors = ["Jose Corral"]
language = "en"
multilingual = false
src = "src"

[build]
build-dir = "book"
create-missing = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
default-theme = "light"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/fluzo-labs/fluzo-docs"
site-url = "/fluzo-docs/"
additional-js = ["mermaid.min.js", "mermaid-init.js"]